exclude_re = [
    # At a width of 0, both branches return 0.
    'geometry\.rs:36:14: replace < with <= in Rect::width$',
    # At a height of 0, both branches return 0.
    'geometry\.rs:43:14: replace < with <= in Rect::height$',
    # When the margin is exactly half the width, half the width is the margin.
    'geometry\.rs:63:30: replace > with >= in Rect::shrink$',
    # When the margin is exactly half the height, half the height is the margin.
    'geometry\.rs:68:30: replace > with >= in Rect::shrink$',
    # A cell of no size on one side only costs NaN or infinity, which never wins.
    'grid\.rs:96:30: replace \|\| with && in Grid::shape_for$',
    # Adds one offset to every shape's cost: equal in exact arithmetic, and a wide search found no float input that differs.
    'grid\.rs:99:50: replace - with \+ in Grid::shape_for$',
    # Without the shortcut, the number goes through the same parse and comes out the same.
    "peer\\.rs:88:35: replace match guard n >= 1 with false in <impl Deserialize<'de> for Cell>::deserialize$",
    # A message of exactly the limit is cut at its own end, which changes nothing.
    'state\.rs:148:24: replace > with >= in HookEvent::trim$',
]
