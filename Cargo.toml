[workspace]
resolver = "3"
members = [
    "crates/daifuku-core",
    "crates/daifuku-win",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/dominikkoenitzer/Daifuku"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
daifuku-core = { path = "crates/daifuku-core" }
daifuku-win = { path = "crates/daifuku-win" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "2.0"
windows = "0.62"
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
