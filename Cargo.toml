[workspace]
resolver = "3"
members = [
    "crates/daifuku-core",
    "crates/daifuku-win",
    "crates/daifuku-render",
    "crates/daifukud",
    "crates/daifuku",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/dominikkoenitzer/Daifuku"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
daifuku-core = { path = "crates/daifuku-core" }
daifuku-win = { path = "crates/daifuku-win" }
daifuku-render = { path = "crates/daifuku-render" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars = "1.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
windows = "0.62"
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
