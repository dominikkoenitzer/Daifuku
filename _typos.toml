# Words that are right: names and deliberate spellings.
[default.extend-words]
# British spellings the codebase uses on purpose.
colour = "colour"
colours = "colours"
centre = "centre"
licence = "licence"

[default.extend-identifiers]
# SDDL: BA is the Administrators group, as in "(A;;GA;;;BA)".
BA = "BA"

[files]
extend-exclude = ["docs/demo.gif", "Cargo.lock", "schema.json"]
