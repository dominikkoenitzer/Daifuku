name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every six hours on top of every push: a new stable Rust, a new runner image
  # or a yanked dependency breaks a build that was green, and on a quiet week
  # nobody would find out until the next push.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  # One group per commit for a push, so no push on main can cancel another
  # before it ran; one per branch for a pull request, where dropping a
  # superseded run costs nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    # Two Windows versions and both profiles. Daifuku is mostly Win32 and DWM
    # behaviour, which differs between releases, and a release-only difference
    # is invisible to a debug-only run.
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.os }}-${{ matrix.profile }}
      - name: Run the suite
        shell: pwsh
        run: |
          $flags = if ('${{ matrix.profile }}' -eq 'release') { '--release' } else { '' }
          cargo test --locked --workspace --all-features $flags

  e2e:
    name: end to end
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      # The real daemon, a real console window and the real hook inside it,
      # on the runner's interactive desktop. The test skips itself without
      # DAIFUKU_E2E, and a skipped test still reports as passed, so the job
      # also requires the tally line only a finished run prints.
      - name: Build both binaries
        run: cargo build --locked --workspace
      - name: Run against a real desktop
        shell: pwsh
        env:
          DAIFUKU_E2E: "1"
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          $output = cargo test --locked -p daifuku --test e2e -- --nocapture --test-threads 1 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "the end-to-end test failed with $LASTEXITCODE" }
          # Three tests, each prints its tally only when it ran to the end.
          $ran = ([regex]::Matches($output, 'e2e: \d+ steps passed')).Count
          if ($ran -lt 3) {
              throw "only $ran of 3 end-to-end tests ran to the end; check the runner has a desktop and Windows Terminal"
          }
      - name: The daemon's log
        if: always()
        shell: pwsh
        run: Get-ChildItem "$env:ProgramData\Daifuku\logs", "$env:LOCALAPPDATA\Daifuku\logs" -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Tail 80

  # The installer, for real, on a machine where it may do everything it does
  # on a user's: Program Files, the locked ProgramData folder, the logon task,
  # the hooks in Claude Code's settings. Then uninstall, and prove every piece
  # is gone again.
  install:
    name: install and uninstall
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: install
      - run: cargo build --locked --release --workspace
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $env:USERPROFILE '.claude\settings.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $settings) | Out-Null
          # A user's own hook, which the install must keep and the uninstall
          # must leave behind untouched.
          '{"theme":"dark","hooks":{"Stop":[{"hooks":[{"type":"command","command":"C:/mine.exe"}]}]}}' |
              Set-Content -Encoding utf8 $settings

          ./target/release/daifuku.exe install --no-start
          if ($LASTEXITCODE -ne 0) { throw "install exited with $LASTEXITCODE" }

          $dir = Join-Path $env:ProgramFiles 'Daifuku'
          foreach ($f in 'daifuku.exe', 'daifukud.exe') {
              if (-not (Test-Path (Join-Path $dir $f))) { throw "$f was not installed" }
          }
          $data = Join-Path $env:ProgramData 'Daifuku'
          $acl = (Get-Acl $data)
          if ($acl.Owner -notmatch 'Administrators') { throw "ProgramData\Daifuku is owned by $($acl.Owner)" }
          $userWrite = $acl.Access | Where-Object {
              $_.IdentityReference -match 'Users$' -and $_.FileSystemRights -match 'Write|Modify|FullControl'
          }
          if ($userWrite) { throw 'ordinary users can write ProgramData\Daifuku' }
          schtasks /Query /TN '\Daifuku\Daemon' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the logon task was not registered' }
          $json = Get-Content -Raw $settings | ConvertFrom-Json
          if ($json.theme -ne 'dark') { throw 'the install lost a setting' }
          if (@($json.hooks.Stop).Count -ne 2) { throw 'Stop should hold the user hook and Daifuku''s' }
          Write-Output 'installed: binaries, locked folder, task, hooks next to the user''s own'

          # Installing twice changes nothing.
          $before = Get-Content -Raw $settings
          ./target/release/daifuku.exe install --no-start | Out-Null
          if ((Get-Content -Raw $settings) -ne $before) { throw 'a second install changed the settings' }

          & (Join-Path $dir 'daifuku.exe') uninstall --purge
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited with $LASTEXITCODE" }
          schtasks /Query /TN '\Daifuku\Daemon' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the logon task survived the uninstall' }
          if (Test-Path $data) { throw 'ProgramData\Daifuku survived --purge' }
          $json = Get-Content -Raw $settings | ConvertFrom-Json
          if (@($json.hooks.Stop).Count -ne 1 -or $json.hooks.Stop[0].hooks[0].command -ne 'C:/mine.exe') {
              throw 'the uninstall did not leave exactly the user''s own hook'
          }
          Write-Output 'uninstalled: task, data and Daifuku''s hooks gone, the user''s hook kept'
          # The last native command asked for a task that is gone on purpose and
          # left its exit code 1 behind, which the runner would report as a
          # failure of this whole step.
          exit 0

  doc:
    name: doc
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: doc
      - run: cargo doc --locked --workspace --all-features --no-deps

  build:
    name: build release
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      # Thin LTO with one codegen unit breaks in ways a debug build does not.
      - run: cargo build --locked --release --workspace

  # Windows on ARM: Snapdragon laptops run x64 programs only through
  # emulation, and a window manager's hooks and timers are the last thing to
  # want emulated. Compile only: a hosted x64 runner cannot run ARM64 code.
  arm64:
    name: build (arm64)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: arm64
      - run: cargo build --locked --release --workspace --target aarch64-pc-windows-msvc
      - name: The binaries really are ARM64
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($exe in 'daifuku.exe', 'daifukud.exe') {
              $bytes = [System.IO.File]::ReadAllBytes("target/aarch64-pc-windows-msvc/release/$exe")
              $pe = [BitConverter]::ToInt32($bytes, 0x3C)
              $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
              if ($machine -ne 0xAA64) { throw ('{0} is machine 0x{1:X4}, not ARM64' -f $exe, $machine) }
              Write-Output "$exe is ARM64"
          }

  # Only on the timer: it compiles against the Rust that is coming, so a
  # failure here is weeks of warning rather than a broken build.
  beta:
    name: next rust
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: beta
      - run: cargo test --locked --workspace --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # Only on the timer: cargo-mutants flips one comparison or drops one call at
  # a time and reports every change no test noticed. daifuku-core is the pure
  # logic, so a surviving mutant there is a real hole in the suite.
  mutants:
    name: mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants --package daifuku-core --no-shuffle --timeout 120
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants
          path: mutants.out/
          retention-days: 14

  schema:
    name: schema is current
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: schema
      # schema.json is what an editor checks a daifuku.json against, and the
      # starter config links it. A key added to the parser without
      # regenerating it would make every editor flag a valid setting.
      - name: Regenerate and compare
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          cargo run --locked --quiet -p daifuku -- schema > schema.generated.json
          $committed = (Get-Content -Raw schema.json) -replace "`r`n", "`n"
          $generated = (Get-Content -Raw schema.generated.json) -replace "`r`n", "`n"
          if ($committed -ne $generated) {
              Write-Output 'schema.json is out of date. Regenerate it with:'
              Write-Output '  cargo run -p daifuku -- schema > schema.json'
              git --no-pager diff --no-index -- schema.json schema.generated.json
              exit 1
          }
          Write-Output 'schema.json matches the parser'

  deny:
    name: cargo-deny
    timeout-minutes: 30
    # cargo-deny-action is a container action and only runs on Linux. It reads
    # Cargo.lock and the advisory database; deny.toml pins the graph to the
    # Windows target, so it audits the same set the other jobs build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Workflows are code too: a typo in an expression or a shell quoting mistake
  # only shows on the run that needed it, often a release. actionlint reads
  # every workflow, including the shell inside `run:` through shellcheck.
  actionlint:
    name: actionlint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # Spelling in code, comments and docs. A misspelt identifier is a bug that
  # compiles; a misspelt word in the README is the first thing a stranger sees.
  typos:
    name: spelling
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  # Every link in the README and the docs resolves, including the schema URL
  # the starter config writes into every user's file.
  links:
    name: links
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments README.md docs
          fail: true

  # The release workflow's packaging, on every push, without publishing: a
  # release that breaks is found here rather than on the tag.
  package:
    name: package (dry run)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      - run: cargo build --locked --release --workspace
      - name: Stage, run and zip
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $stage = 'dist/Daifuku-dry-run'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/daifuku.exe, target/release/daifukud.exe, LICENSE $stage
          foreach ($exe in 'daifuku.exe', 'daifukud.exe') {
              # Waited for and compared, as the release does: daifukud is
              # windowless, so the call operator would not wait for its output.
              $capture = New-TemporaryFile
              $p = Start-Process -FilePath "$stage/$exe" -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $capture
              $out = (Get-Content -Raw $capture).Trim()
              Remove-Item $capture
              if ($p.ExitCode -ne 0) { throw "$exe --version exited with $($p.ExitCode)" }
              $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
              if ($out -notmatch [regex]::Escape($version)) { throw "$exe reports '$out', the workspace is $version" }
              Write-Output "$exe -> $out"
          }
          & "$stage/daifuku.exe" schema | Out-File -Encoding utf8 "$stage/daifuku.schema.json"
          Compress-Archive -Path "$stage/*" -DestinationPath dist/Daifuku-dry-run.zip -Force
          $size = (Get-Item dist/Daifuku-dry-run.zip).Length
          Write-Output "zip is $size bytes"
          if ($size -gt 20MB) { throw 'the release zip grew past 20 MB' }
