name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: terminal front probe
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        shell: pwsh
        run: ./probe.ps1
