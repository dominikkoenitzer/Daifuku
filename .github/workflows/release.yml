name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, for example v0.1.0. Leave empty to build the current branch and only upload the downloads as a workflow artifact."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# Nothing by default: each job asks for what it needs, and only the one that
# runs no build code at all may write.
permissions: {}

env:
  TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The same audit CI runs, and for the same reason: a release is the one
  # artifact strangers actually download, so it must not be the thing that
  # skipped the advisory database. It is a container action and therefore the
  # one job here that is not on Windows; `deny.toml` pins the graph to the
  # Windows target, so the dependency set it audits is the one being shipped.
  deny:
    name: cargo-deny
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Build scripts, proc macros and tests of every dependency run in this job,
  # so it gets a read-only token, keeps it out of .git/config, and starts from
  # nothing: no cache that another workflow wrote goes into a release.
  build:
    name: Build
    needs: deny
    timeout-minutes: 60
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # The same toolchain CI uses: stable, plus rust-toolchain.toml, and the
      # ARM64 target for the second zip.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      # Nothing is packaged that has not passed the suite first. A tag push
      # does not run CI, so everything CI would have said has to be said here
      # too: a release built from a commit that never saw clippy or the
      # advisory database is a release nobody checked.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build
        run: cargo build --locked --release --workspace

      # The tag and the ref name arrive as environment variables, never pasted
      # into the script: a branch may be called anything, quotes included.
      - name: Stage binaries
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
              if ($env:GITHUB_REF_TYPE -eq 'tag') {
                  $tag = $env:GITHUB_REF_NAME
              } else {
                  # The name becomes the artifact's, which may not hold a
                  # slash, and a branch such as fix/x has one.
                  $branch = $env:GITHUB_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
                  $tag = "$branch-$($env:GITHUB_SHA.Substring(0, 7))"
              }
          }
          $name = "Daifuku-$tag-$env:TARGET"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/daifuku.exe" $stage
          Copy-Item "target/release/daifukud.exe" $stage
          Copy-Item "LICENSE" $stage
          $forward = $stage.Replace('\', '/')
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE_DIR=$forward" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The download for everyone: daifuku.exe on its own, carrying the
      # daemon staged above, so one file installs on a double click. Built
      # after the zip's binaries because it embeds that very daifukud.exe;
      # the zip keeps the daifuku.exe without it. Its name carries no
      # version, so releases/latest/download/daifuku.exe always works.
      - name: Build daifuku.exe with the daemon inside
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $daemon = (Resolve-Path "$env:STAGE_DIR/daifukud.exe").Path
          $env:DAIFUKU_EMBED_DAEMON = $daemon
          cargo build --locked --release -p daifuku
          if ($LASTEXITCODE -ne 0) { throw "the build of daifuku.exe with the daemon inside failed" }
          $exe = 'dist/daifuku.exe'
          Copy-Item 'target/release/daifuku.exe' $exe
          # One no bigger than the daemon was built without it.
          $size = (Get-Item $exe).Length
          $payload = (Get-Item $daemon).Length
          if ($size -le $payload) { throw "daifuku.exe is $size bytes, no more than the $payload bytes of the daemon it should carry" }
          # Alone in a folder, as a download is, the install plan must take
          # the daemon from inside it. A dry run changes nothing.
          $alone = Join-Path $env:RUNNER_TEMP 'alone'
          New-Item -ItemType Directory -Force -Path $alone | Out-Null
          Copy-Item $exe $alone
          $plan = & (Join-Path $alone 'daifuku.exe') install --dry-run --json --no-start | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "install --dry-run exited with $LASTEXITCODE" }
          $copy = @($plan.steps | Where-Object { $_.action -eq 'copy' -and $_.target -like '*\daifukud.exe' })
          if ($copy.Count -ne 1 -or $copy[0].detail -notlike 'carried inside *') { throw "the plan does not take the daemon from inside daifuku.exe: $($plan | ConvertTo-Json -Depth 5)" }
          Remove-Item -Recurse -Force $alone
          Write-Output "daifuku.exe is $size bytes and carries the $payload-byte daemon"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$exe.sha256", "$hash  daifuku.exe`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content "$exe.sha256"

      - name: Verify the staged binaries run and agree with the tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # The tag being published, when there is one. A workflow_dispatch on a
          # branch has none, and must not be held to this.
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag) -and $env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
          }
          $expected = if ($tag -match '^v(.+)$') { $Matches[1] } else { $null }

          # The zip's two and the daifuku.exe that is downloaded on its own.
          $paths = @(
              (Join-Path $env:STAGE_DIR 'daifuku.exe'),
              (Join-Path $env:STAGE_DIR 'daifukud.exe'),
              (Join-Path $env:GITHUB_WORKSPACE 'dist/daifuku.exe')
          )
          foreach ($path in $paths) {
              $exe = Split-Path -Leaf $path
              # Start-Process with -Wait, not the call operator: daifukud is a
              # windowless program, and PowerShell does not wait for one, so
              # `& daifukud --version` returned before it printed anything and
              # the check below read an empty string.
              $capture = New-TemporaryFile
              $p = Start-Process -FilePath $path -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $capture
              $output = (Get-Content -Raw $capture).Trim()
              Remove-Item $capture
              if ($p.ExitCode -ne 0) { throw "$exe --version exited with $($p.ExitCode)" }
              Write-Output "$exe -> $output"

              # Running is not the same as being the thing the tag says. Without
              # this, tagging v0.1.14 while Cargo.toml still reads 0.1.13 ships a
              # binary that reports the wrong version to every user who runs it,
              # and nothing anywhere would have said a word.
              #
              # Pulled out and compared whole, NOT matched as a substring: a
              # substring test passes '0.1.1' against a binary reporting
              # '0.1.13', which is the one mistake this check exists to catch.
              if ($expected) {
                  if ($output -notmatch '(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.\-]+)?)') {
                      throw "could not read a version out of '$output' for $exe"
                  }
                  $actual = $Matches[1]
                  if ($actual -ne $expected) {
                      throw "$exe reports $actual but the tag is $tag; bump the workspace version before tagging"
                  }
              }
          }
          if ($expected) {
              Write-Output "every binary agrees with tag $tag"
          } else {
              Write-Output 'no tag to check against, this is a branch build'
          }

      - name: Generate JSON schema
        shell: bash
        run: ./target/release/daifuku.exe schema > "$STAGE_DIR/daifuku.schema.json"

      # The zips carry no version in their names, so every release calls them
      # the same and the README can link to /releases/latest/download/ for
      # good.
      - name: Package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $file = 'daifuku-windows-x64.zip'
          $zip = "dist/$file"
          Compress-Archive -Path "$env:STAGE_DIR/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          # LF, not CRLF: `sha256sum -c` takes the whole rest of the line as
          # the file name, so a trailing CR makes it look for a file that does
          # not exist and the check fails on a perfectly good download.
          $line = "$hash  $file`n"
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$zip.sha256", $line, [System.Text.UTF8Encoding]::new($false))
          Get-Content "$zip.sha256"

      # The same package for Windows on ARM. It cannot be run on this x64
      # runner, so instead of running it the check reads each binary's PE
      # header and insists on the ARM64 machine type; everything else in the
      # zip is the x64 package's own, already checked above.
      - name: Build, check and package for ARM64
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --workspace --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "the ARM64 build failed" }
          $name = $env:PACKAGE_NAME.Replace($env:TARGET, 'aarch64-pc-windows-msvc')
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($exe in 'daifuku.exe', 'daifukud.exe') {
              Copy-Item "target/aarch64-pc-windows-msvc/release/$exe" $stage
              $bytes = [System.IO.File]::ReadAllBytes("$stage/$exe")
              $pe = [BitConverter]::ToInt32($bytes, 0x3C)
              $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
              if ($machine -ne 0xAA64) { throw ('{0} is machine 0x{1:X4}, not ARM64' -f $exe, $machine) }
          }
          Copy-Item LICENSE, "$env:STAGE_DIR/daifuku.schema.json" $stage
          $file = 'daifuku-windows-arm64.zip'
          $zip = "dist/$file"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$zip.sha256", "$hash  $file`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content "$zip.sha256"

          # And the one-file download, carrying the ARM64 daemon just checked.
          $daemon = (Resolve-Path "$stage/daifukud.exe").Path
          $env:DAIFUKU_EMBED_DAEMON = $daemon
          cargo build --locked --release -p daifuku --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "the ARM64 build of daifuku.exe with the daemon inside failed" }
          $file = 'daifuku-arm64.exe'
          $exe = "dist/$file"
          Copy-Item 'target/aarch64-pc-windows-msvc/release/daifuku.exe' $exe
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { throw ('{0} is machine 0x{1:X4}, not ARM64' -f $file, $machine) }
          $payload = (Get-Item $daemon).Length
          if ($bytes.Length -le $payload) { throw "$file is $($bytes.Length) bytes, no more than the $payload bytes of the daemon it should carry" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$exe.sha256", "$hash  $file`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content "$exe.sha256"

      # Always available, so a workflow_dispatch without a tag still produces
      # downloads that can be tried.
      - name: Upload the downloads as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/daifuku.exe
            dist/daifuku.exe.sha256
            dist/daifuku-arm64.exe
            dist/daifuku-arm64.exe.sha256
            dist/daifuku-windows-x64.zip
            dist/daifuku-windows-x64.zip.sha256
            dist/daifuku-windows-arm64.zip
            dist/daifuku-windows-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # The only job with a token that can write, and it runs no code from the
  # repository or its dependencies: it takes the downloads the build job
  # uploaded and publishes them. On a branch build it stops before publishing, so a
  # dry run still proves the hand-over works.
  publish:
    name: Publish
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The binaries as a user gets them out of the zip, so each one can be
      # checked with `gh attestation verify` on its own, not only the zip.
      - name: Take the binaries out of the zips
        shell: bash
        run: |
          set -euo pipefail
          for zip in dist/*.zip; do
              unzip -q -o "$zip" daifuku.exe daifukud.exe -d "${zip%.zip}"
          done
          ls -lR dist

      # Signed SLSA provenance: which workflow, commit and run built each
      # download and each binary. Only when this run is on the tag it releases: the
      # provenance names the run's own ref and commit, so a release dispatched
      # from a branch would say the branch built it. Never for a branch build.
      - name: Attest build provenance
        if: github.ref == format('refs/tags/{0}', inputs.tag || github.ref_name)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*/daifuku.exe
            dist/*/daifukud.exe

      - name: Say why there is no provenance
        if: inputs.tag != '' && github.ref != format('refs/tags/{0}', inputs.tag)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "::warning::No provenance for $RELEASE_TAG, this run is on $GITHUB_REF. Run the workflow from the tag itself (Use workflow from $RELEASE_TAG) to attest it."

      # A version with a pre-release part, such as v0.2.0-rc.1, is published
      # as a pre-release, so it never becomes the latest release the README's
      # download link leads to.
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.zip
            dist/*.zip.sha256
