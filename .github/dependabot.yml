version: 2
updates:
  # Cargo dependencies. Every crate takes its version from
  # [workspace.dependencies] in the root manifest, so one directory covers the
  # whole workspace. Semver-compatible bumps land in Cargo.lock; a major gets
  # its own PR, which matters most for windows, where even a 0.x bump moves
  # the API.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # A week before a new release is proposed: long enough for a hijacked or
    # broken publish to be yanked first. Security updates skip the wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # windows-core comes in only through windows (windows::core), so it
      # always moves with it and never gets a PR of its own.
      windows:
        patterns:
          - "windows"
      minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
